name: Enterprise CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # Stage 1: Lint, Typecheck & Quality Gate
  # ==========================================
  quality-gate:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        working-directory: ./client
        run: npm ci --prefer-offline

      - name: TypeScript Typecheck Frontend
        working-directory: ./client
        run: npm run build

      - name: Install Gateway Dependencies
        working-directory: ./gateway
        run: npm ci --prefer-offline

      - name: Install Microservices Dependencies
        working-directory: ./services
        run: npm ci --prefer-offline

  # ==========================================
  # Stage 2: Automated Multi-Tier Unit Tests
  # ==========================================
  unit-tests:
    name: Microservices Unit Test Suite
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Microservices Dependencies
        working-directory: ./services
        run: npm ci --prefer-offline

      - name: Run Multi-Tier Unit Tests
        working-directory: ./services
        run: node --test tests/unit/*.test.js

  # ==========================================
  # Stage 3: Docker Multi-Stage Image Builds
  # ==========================================
  docker-builds:
    name: Docker Multi-Stage Build Matrix
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      matrix:
        include:
          - service: client
            context: ./client
            dockerfile: ./client/Dockerfile
          - service: gateway
            context: ./gateway
            dockerfile: ./gateway/Dockerfile
          - service: auth-service
            context: ./services
            dockerfile: ./services/Dockerfile.service
            build_args: SERVICE_NAME=auth-service,SERVICE_PORT=5001
          - service: order-service
            context: ./services
            dockerfile: ./services/Dockerfile.service
            build_args: SERVICE_NAME=order-service,SERVICE_PORT=5004
          - service: product-service
            context: ./services
            dockerfile: ./services/Dockerfile.service
            build_args: SERVICE_NAME=product-service,SERVICE_PORT=5002
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (${{ matrix.service }})
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: novacommerce/${{ matrix.service }}:test
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # Stage 4: Kubernetes Manifest Validation
  # ==========================================
  k8s-validation:
    name: Kubernetes Manifest Lint & Validation
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Schema
        run: docker compose config

      - name: Validate Kubernetes Manifests
        run: |
          echo "Validating k8s manifests in k8s/..."
          ls -la k8s/
          ls -la k8s/deployments/
          ls -la k8s/services/
