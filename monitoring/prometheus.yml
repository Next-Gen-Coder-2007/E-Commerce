global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'api-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['gateway:5000', 'host.docker.internal:5000']

  - job_name: 'auth-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['auth-service:5001', 'host.docker.internal:5001']

  - job_name: 'product-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['product-service:5002', 'host.docker.internal:5002']

  - job_name: 'cart-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['cart-service:5003', 'host.docker.internal:5003']

  - job_name: 'order-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['order-service:5004', 'host.docker.internal:5004']

  - job_name: 'payment-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['payment-service:5005', 'host.docker.internal:5005']

  - job_name: 'wishlist-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['wishlist-service:5006', 'host.docker.internal:5006']

  - job_name: 'inventory-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['inventory-service:5007', 'host.docker.internal:5007']
